 <text x="36" y="179" class="name" fill="#a2b59f"><tspan opacity="0">I<animate attributeName="opacity" from="0" to="1" begin="2.67s" dur="0.14s" fill="freeze"/></tspan><tspan opacity="0">s<animate attributeName="opacity" from="0" to="1" begin="2.88s" dur="0.14s" fill="freeze"/></tspan><tspan opacity="0">m<animate attributeName="opacity" from="0" to="1" begin="3.09s" dur="0.14s" fill="freeze"/></tspan><tspan opacity="0">a<animate attributeName="opacity" from="0" to="1" begin="3.30s" dur="0.14s" fill="freeze"/></tspan><tspan opacity="0">i<animate attributeName="opacity" from="0" to="1" begin="3.51s" dur="0.14s" fill="freeze"/></tspan><tspan opacity="0">l<animate attributeName="opacity" from="0" to="1" begin="3.72s" dur="0.14s" fill="freeze"/></tspan></text>
