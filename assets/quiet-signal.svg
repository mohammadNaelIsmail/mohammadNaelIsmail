 <text x="35" y="34" class="label">MOHAMMAD / AI FIELD NOTES 001</text>
 <text x="36" y="119" class="name" fill="#edf1ea"><tspan opacity="1">M<set attributeName="opacity" to="0" begin="0s" dur="0.4200s"/><animate attributeName="opacity" from="0" to="1" begin="0.4200s" dur="0.2300s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">o<set attributeName="opacity" to="0" begin="0s" dur="0.7239s"/><animate attributeName="opacity" from="0" to="1" begin="0.7239s" dur="0.1625s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">h<set attributeName="opacity" to="0" begin="0s" dur="0.9196s"/><animate attributeName="opacity" from="0" to="1" begin="0.9196s" dur="0.1704s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">a<set attributeName="opacity" to="0" begin="0s" dur="1.1249s"/><animate attributeName="opacity" from="0" to="1" begin="1.1249s" dur="0.1550s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">m<set attributeName="opacity" to="0" begin="0s" dur="1.3117s"/><animate attributeName="opacity" from="0" to="1" begin="1.3117s" dur="0.2300s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">m<set attributeName="opacity" to="0" begin="0s" dur="1.6275s"/><animate attributeName="opacity" from="0" to="1" begin="1.6275s" dur="0.2300s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">a<set attributeName="opacity" to="0" begin="0s" dur="1.9434s"/><animate attributeName="opacity" from="0" to="1" begin="1.9434s" dur="0.1550s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">d<set attributeName="opacity" to="0" begin="0s" dur="2.1302s"/><animate attributeName="opacity" from="0" to="1" begin="2.1302s" dur="0.1658s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan></text>
 <rect x="36" y="75" width="2" height="46" rx="1" fill="#e4ece3" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.94;1" begin="0.4200s" dur="2.0800s" fill="freeze"/><animate attributeName="x" from="36" to="355.085" begin="0.4200s" dur="1.9100s" fill="freeze" calcMode="linear"/></rect><text x="36" y="179" class="name" fill="#a2b59f"><tspan opacity="1">I<set attributeName="opacity" to="0" begin="0s" dur="2.5500s"/><animate attributeName="opacity" from="0" to="1" begin="2.5500s" dur="0.1273s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">s<set attributeName="opacity" to="0" begin="0s" dur="2.7034s"/><animate attributeName="opacity" from="0" to="1" begin="2.7034s" dur="0.1740s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">m<set attributeName="opacity" to="0" begin="0s" dur="2.9131s"/><animate attributeName="opacity" from="0" to="1" begin="2.9131s" dur="0.2300s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">a<set attributeName="opacity" to="0" begin="0s" dur="3.3456s"/><animate attributeName="opacity" from="0" to="1" begin="3.3456s" dur="0.2123s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">i<set attributeName="opacity" to="0" begin="0s" dur="3.6014s"/><animate attributeName="opacity" from="0" to="1" begin="3.6014s" dur="0.1050s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan><tspan opacity="1">l<set attributeName="opacity" to="0" begin="0s" dur="3.7158s"/><animate attributeName="opacity" from="0" to="1" begin="3.7158s" dur="0.1050s" fill="freeze" calcMode="spline" keySplines=".15 0 .32 1"/></tspan></text>
 <rect x="36" y="135" width="2" height="46" rx="1" fill="#a7bda6" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.94;1" begin="2.5500s" dur="1.4500s" fill="freeze"/><animate attributeName="x" from="36" to="193.166" begin="2.5500s" dur="1.2800s" fill="freeze" calcMode="linear"/></rect><text x="38" y="221" class="sub">AI engineering, from models to systems.</text>
