  <animate attributeName="x" values="36.000;54.596;54.596;54.596;80.016;80.016;80.016;132.446;132.446;132.446;163.456;163.456;163.456;177.317;177.317;177.317;191.166;191.166" keyTimes="0.000000;0.102190;0.152555;0.153285;0.255474;0.305839;0.306569;0.408759;0.459124;0.459854;0.562044;0.612409;0.613139;0.715328;0.765693;0.766423;0.868613;1.000000" calcMode="linear" begin="2.67s" dur="1.370s" fill="freeze"/>
