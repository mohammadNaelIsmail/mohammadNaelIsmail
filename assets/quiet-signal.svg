  <animate attributeName="opacity" values="1;1;0" keyTimes="0;.88;1" begin="0.48s" dur="1.790s" fill="freeze"/>
  <animate attributeName="x" values="36.000;86.448;86.448;86.448;118.941;118.941;118.941;153.024;153.024;153.024;184.034;184.034;184.034;236.464;236.464;236.464;288.906;288.906;288.906;319.915;319.915;319.915;353.085;353.085" keyTimes="0.000000;0.078212;0.116760;0.117318;0.195531;0.234078;0.234637;0.312849;0.351397;0.351955;0.430168;0.468715;0.469274;0.547486;0.586034;0.586592;0.664804;0.703352;0.703911;0.782123;0.820670;0.821229;0.899441;1.000000" calcMode="linear" begin="0.48s" dur="1.790s" fill="freeze"/>
 </rect>
