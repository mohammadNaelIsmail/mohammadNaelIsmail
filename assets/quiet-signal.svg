<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 305" role="img" aria-labelledby="title desc">
<title id="title">Mohammad Ismail — Quiet Signal</title>
<desc id="desc">A restrained charcoal and sage green AI engineering profile banner. Each letter of the name fades into view smoothly with a synchronized writing cursor and stays visible; a gentle orbiting signal animates beside it.</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11191a"/><stop offset=".58" stop-color="#111719"/><stop offset="1" stop-color="#17211f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#7d9c88" stop-opacity=".10"/><stop offset="1" stop-color="#7d9c88" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#a5b4ad" stroke-opacity=".05" stroke-width=".7"/></pattern>
 <clipPath id="mask"><rect x=".5" y=".5" width="959" height="304" rx="13"/></clipPath>
 <style><![CDATA[
  .label{font:500 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#94aaa1;letter-spacing:2.1px}
  .sub{font:400 18px ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;fill:#bec9c1}
  .name{font:600 57px ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:-2.5px}
  .micro{font:400 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#7e948b;letter-spacing:1px}
  @media (prefers-reduced-motion:reduce){
   .orbit,.pulse{animation:none!important}
  }
 ]]></style>
</defs>
<g clip-path="url(#mask)">
